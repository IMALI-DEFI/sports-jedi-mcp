startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      sportsJediApiKey:
        type: string
        description: Sports Jedi developer API key (sj_live_…). Get one at https://sportsjedi.com/developers
  commandFunction: |-
    (config) => ({ command: 'node', args: ['src/server.js'], env: { SPORTS_JEDI_API_KEY: config.sportsJediApiKey || '' } })
